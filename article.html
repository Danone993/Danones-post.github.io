<!DOCTYPE html>
<html lang="ru" translate="no"><head><meta name="google" content="notranslate">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Статья — Молдавская прослушка</title><link rel="stylesheet" href="ms.css?v=2"><link rel="icon" type="image/png" href="favicon.png"></head>
<body class="ms-page"><header id="ms-header"></header><main class="ms-wrap" id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="ms.js?v=2"></script>
<script>
(async()=>{const {sb,st,esc,fmtDate}=MS;await MS.ready;

MS.header();
const slug=new URLSearchParams(location.search).get("a")||"";
const {data:src}=await sb.from("articles").select("source_url").eq("slug",slug).maybeSingle();
if(src&&src.source_url){location.replace(src.source_url);return}
let d;try{d=await MS.fetchArticle(slug)}catch(e){app.innerHTML=`<div class="ms-empty"><p><b>${e.status===404?"Материал не найден":"Не удалось загрузить материал"}</b></p><a class="ms-btn" href="category.html">Ко всем публикациям</a></div>`;return}
const a=d.article,cat=a.categories||{};MS.noteRead(slug,cat.slug);document.title=(a.seo_title||a.title)+" — Молдавская прослушка";
const md=document.querySelector('meta[name=description]')||document.head.appendChild(Object.assign(document.createElement("meta"),{name:"description"}));md.content=a.seo_description||a.subtitle||"";
const clean=h=>DOMPurify.sanitize(h||"",{ADD_TAGS:["video"],ADD_ATTR:["autoplay","loop","muted","playsinline","target"]});
let bodyHTML=d.locked?clean(a.preview_html):clean(d.body_html);
const gate=d.locked?`<div class="ms-gate"><div class="ms-panel" style="text-align:center;margin-top:-30px;position:relative"><span class="ms-tag prem">★ Premium</span><h2 style="margin:12px 0 6px">Продолжение — для Premium-читателей</h2><p class="ms-lead" style="margin:0 auto 16px">${st.user?"Активируйте Premium, чтобы читать полный текст.":"Войдите или создайте аккаунт, затем откройте Premium."}</p><div class="ms-row" style="justify-content:center">${st.user?"":`<a class="ms-btn" href="${MS.loginUrl()}">Войти</a>`}<a class="ms-btn primary" href="premium.html">Открыть Premium</a></div></div></div>`:"";
app.innerHTML=`<article><div style="max-width:720px;margin:0 auto 22px"><div class="ms-row" style="margin-bottom:10px"><a class="ms-tag" style="text-decoration:none" href="category.html?c=${encodeURIComponent(cat.slug||"")}">${esc(cat.name||"")}</a><span class="ms-tag${a.access==="premium"?" prem":""}">${a.access==="premium"?"★ Premium":"Бесплатно"}</span><span style="color:var(--ms-muted);font-size:13px">${esc(fmtDate(a.published_at))}</span><span style="margin-left:auto;position:relative;width:38px;height:38px;display:inline-block">${MS.bookmarkBtn(a.id).replace('class="ms-bm','style="top:0;right:0" class="ms-bm')}</span></div>
<h1 class="ms-h1">${esc(a.title)}</h1>${a.subtitle?`<p class="ms-lead" style="margin:0">${esc(a.subtitle)}</p>`:""}</div>
${a.cover_url?`<img class="ms-cover" style="max-width:960px;margin:0 auto 28px;border-radius:22px;aspect-ratio:16/9" src="${esc(a.cover_url)}" alt="${esc(a.cover_alt||"")}">`:""}
<div id="toc"></div><div class="ms-prose${d.locked?" ms-fade":""}" id="body">${bodyHTML}</div>${gate}</article><section id="rel" style="margin-top:50px"></section>`;
if(a.cover_url){document.querySelectorAll("#body img").forEach(i=>{if(i.getAttribute("src")===a.cover_url){const f=i.closest("figure");(f||i).remove()}})}
const hs=[...document.querySelectorAll("#body h2")];
if(!d.locked&&hs.length>=3){hs.forEach((h,i)=>h.id="s"+i);document.getElementById("toc").innerHTML=`<nav class="ms-toc" aria-label="Содержание"><b>В этом материале</b>${hs.map((h,i)=>`<a href="#s${i}">${esc(h.textContent)}</a>`).join("")}</nav>`}
const cats=await MS.categories(),c=cats.find(x=>x.slug===cat.slug);
if(c){const {data:rel}=await sb.from("articles").select("id,slug,title,subtitle,cover_url,cover_alt,access,source_url,published_at,categories(slug,name)").eq("category_id",c.id).neq("slug",a.slug).order("published_at",{ascending:false}).limit(3);
 if(rel&&rel.length)document.getElementById("rel").innerHTML=`<h2>Похожие публикации</h2><div class="ms-grid">${rel.map(MS.cardHTML).join("")}</div>`}

})();
</script></body></html>
